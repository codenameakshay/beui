name: beui_example
description: "Gallery app showcasing beUI components — one route per component."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  beui:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # beui.dev serves Geist (its CSS declares `font-family: Geist`, weights
  # 100-900). Bundling it here — in the gallery only, never in the published
  # package — removes the systematic glyph-metric error from every visual diff
  # the harness takes against the site. Only the four weights the source
  # actually uses are vendored (Tailwind font-normal/medium/semibold/bold).
  #
  # Geist is (c) 2024 The Geist Project Authors, SIL Open Font License 1.1 —
  # redistributable. Licence text: assets/fonts/OFL.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    # Code surfaces (BeuiCodeBlock, BeuiFileDiff) ask for `monospace`, the
    # generic CSS family the source's `font-mono` resolves to. Flutter's web
    # backends build their font collection from the asset manifest only — they
    # do NOT fall back to the browser's generic families — so `monospace` (and
    # Menlo/Consolas/…) resolve to nothing on web and code renders in the
    # proportional default. Registering Geist Mono *under that generic name*
    # gives the gallery and the visual harness a real mono face without the
    # published package having to ship or name a font of its own. Same scope
    # rule as Geist above: gallery only, never the package.
    #
    # Geist Mono is (c) 2024 The Geist Project Authors, SIL OFL 1.1 —
    # redistributable. Licence text: assets/fonts/OFL.txt.
    - family: monospace
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500

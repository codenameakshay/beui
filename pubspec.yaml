name: beui
description: "Spring-physics motion components for Flutter — a one-to-one port of the beUI React library, from switches and docks to shader backgrounds."
version: 0.0.1
repository: https://github.com/codenameakshay/beui
homepage: https://codenameakshay.github.io/beui/
issue_tracker: https://github.com/codenameakshay/beui/issues
topics:
  - ui
  - animation
  - motion
  - widgets
  - components

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Pinned tighter than a caret per docs/PORTING_SPEC.md §1: motor is a
  # single-maintainer dependency the whole library rests on. Bump deliberately
  # after re-running fidelity goldens.
  motor: ">=1.1.0 <1.2.0"
  # Default Lucide icon set, mirroring the source's lucide-react glyphs
  # (docs/PORTING_SPEC.md §3). flutter_lucide is chosen over the stale
  # lucide_icons (2y old, Lucide ~0.257) — it tracks Lucide 1.11+, ships all
  # six platforms, MIT. Re-exported via lib/src/tokens/icons.dart so it is a
  # consumer-facing transitive dependency (see README). Capped below the next
  # major (icon additions in minors are wanted and low-risk; a major could
  # rename glyphs) — looser than motor's pin because icons aren't motion-core.
  flutter_lucide: ">=1.11.0 <2.0.0"
  # Zone-scoped `clock.now()` for the one component that reads a wall clock
  # (BeuiAgentProgress's elapsed timer). Identical to DateTime.now() in
  # production, but flutter_test's fake async overrides it — so a widget whose
  # updates tick on fake time also *reads* fake time, and consumers can drive
  # the timer deterministically in their own tests. Dart-team package, no
  # transitive deps; already present transitively via flutter_test.
  clock: ^1.1.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # The shared 128x128 RGBA noise texture (the exact PNG from
  # @paper-design/shaders) sampled by the texture-driven shader variants
  # (voronoi, warp, metaballs, god-rays, smoke-ring, pulsing-border,
  # grain-gradient, dot-orbit). Consumers load it as
  # `packages/beui/assets/beui_shader_noise.png`.
  assets:
    - assets/beui_shader_noise.png

  # Fragment shaders backing BeuiShaderBackground (ports of @paper-design/shaders
  # GLSL). Compiled by the flutter tool into the asset bundle; consumers load
  # them as `packages/beui/shaders/<name>.frag`.
  shaders:
    - shaders/beui_shader_probe.frag
    - shaders/beui_simplex_noise.frag
    - shaders/beui_dot_grid.frag
    - shaders/beui_mesh_gradient.frag
    - shaders/beui_static_mesh_gradient.frag
    - shaders/beui_perlin_noise.frag
    - shaders/beui_swirl.frag
    - shaders/beui_waves.frag
    - shaders/beui_spiral.frag
    - shaders/beui_static_radial_gradient.frag
    - shaders/beui_neuro_noise.frag
    - shaders/beui_voronoi.frag
    - shaders/beui_metaballs.frag
    - shaders/beui_smoke_ring.frag
    - shaders/beui_warp.frag
    - shaders/beui_god_rays.frag
    - shaders/beui_dot_orbit.frag
    - shaders/beui_dithering.frag
    - shaders/beui_color_panels.frag
    - shaders/beui_pulsing_border.frag
    - shaders/beui_grain_gradient.frag
    - shaders/beui_water.frag

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
